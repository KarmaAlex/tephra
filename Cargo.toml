[workspace]
resolver = "2"
members = ["crates/core", "crates/app"]
exclude = ["spikes", "bench"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"
publish = false

[workspace.dependencies]
ropey = "1.6"
unicode-segmentation = "1.13"

[profile.release]
debug = false
strip = true

[profile.dev.package."*"]
opt-level = 2
