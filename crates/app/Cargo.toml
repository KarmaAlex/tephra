[package]
name = "obsidilight"
description = "Lightweight Obsidian-compatible notes app (GPUI)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
obsidilight-core = { path = "../core" }
gpui-kit = { version = "0.10", features = ["tree-sitter-c", "tree-sitter-cpp", "tree-sitter-java", "tree-sitter-javascript", "tree-sitter-yaml", "tree-sitter-python", "tree-sitter-bash", "tree-sitter-sql"] }
ratex-parser = "0.1.16"
ratex-layout = "0.1.16"
ratex-types = "0.1.16"
ratex-render = { version = "0.1.16", features = ["embed-fonts"] }
rquickjs = "0.14"
notify = "8"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
trash = "5"
serde_json = "1"
regex = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff"] }
spellbook = "0.4.2"
sha2 = "0.11.1"
