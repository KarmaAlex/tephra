[package]
name = "obsidilight"
description = "Lightweight Obsidian-compatible notes app (GPUI)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
build = "build.rs"

[dependencies]
obsidilight-core = { path = "../core" }
gpui-kit = { version = "0.10", features = ["tree-sitter-c", "tree-sitter-cpp", "tree-sitter-java", "tree-sitter-javascript", "tree-sitter-yaml", "tree-sitter-python", "tree-sitter-bash", "tree-sitter-sql"] }
ratex-parser = "0.1.16"
ratex-layout = "0.1.16"
ratex-types = "0.1.16"
ratex-render = { version = "0.1.16", features = ["embed-fonts"] }
rquickjs = "0.14"
notify = "8"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
trash = "5"
serde_json = "1"
# logging.rs: GPUI's warnings/errors to stderr and, on Windows, to a log file
log = { version = "0.4.35", features = ["std"] }
regex = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff"] }
spellbook = "0.4.2"
sha2 = "0.11.1"
# PDF export (M5): Typst in-process, as in the M0 spike
typst = "0.15.1"
typst-pdf = "0.15.1"
typst-layout = "0.15.1"
typst-svg = "0.15.1"
# preview pages rasterised in the export worker (same resvg as gpui-component)
resvg = "0.45.1"
typst-kit = { version = "0.15.1", default-features = false, features = ["embedded-fonts", "scan-fonts"] }

[build-dependencies]
# Windows exe icon (build.rs); does nothing on other targets
embed-resource = "3.0.12"
